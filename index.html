<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTracker Pro</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%92%AA</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%92%AA</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="exercises-data.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --primary:linear-gradient(135deg,#667eea,#764ba2);
            --gym:linear-gradient(135deg,#f093fb,#f5576c);
            --casa:linear-gradient(135deg,#4facfe,#00f2fe);
            --bg:#0f172a;
            --card:rgba(255,255,255,0.07);
            --border:rgba(255,255,255,0.12);
            --text:rgba(255,255,255,0.9);
            --muted:rgba(255,255,255,0.55);
            --success:#10b981;
            --radius:16px;
            --radius-lg:24px;
        }
        body{font-family:'Inter',sans-serif;background:var(--bg);background-image:radial-gradient(at 0% 0%,rgba(102,126,234,0.12) 0,transparent 50%),radial-gradient(at 100% 100%,rgba(118,75,162,0.12) 0,transparent 50%);min-height:100vh;padding:20px;color:var(--text)}
        .container{max-width:1400px;margin:0 auto}

        /* HEADER */
        header{background:var(--card);backdrop-filter:blur(20px);padding:36px;border-radius:var(--radius-lg);border:1px solid var(--border);margin-bottom:24px;text-align:center;position:relative;overflow:hidden}
        header::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--primary)}
        h1{font-size:2.8em;font-weight:800;background:var(--primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px;margin-bottom:8px}
        .subtitle{color:var(--muted);font-size:1.05em}

        /* AUTH GATE / LANDING */
        .gate{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);background-image:radial-gradient(at 0% 0%,rgba(102,126,234,.18) 0,transparent 50%),radial-gradient(at 100% 100%,rgba(118,75,162,.18) 0,transparent 50%)}
        .gate.hidden{display:none}
        .gate-card{background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:var(--radius-lg);padding:48px 40px;max-width:440px;width:100%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.45);animation:slideUp .5s ease-out}
        .gate-logo{font-size:4em;line-height:1;margin-bottom:12px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.3))}
        .gate-title{font-size:2.4em;font-weight:800;background:var(--primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px;margin-bottom:12px}
        .gate-sub{color:var(--muted);font-size:1.05em;line-height:1.6;margin-bottom:30px}
        .gate-btn{width:100%;justify-content:center;padding:15px;font-size:1.05em}
        .gate-note{color:var(--muted);font-size:.82em;margin-top:18px}
        .gate-spinner{width:52px;height:52px;border:4px solid rgba(255,255,255,.15);border-top-color:#667eea;border-radius:50%;animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        /* loading state: show spinner, hide card. landing state: reverse */
        .gate.loading .gate-card{display:none}
        .gate.landing .gate-spinner{display:none}

        /* AUTH BAR */
        .auth-bar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:14px;min-height:40px;flex-wrap:wrap;position:relative;z-index:2}
        .auth-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.08);color:var(--text);font-family:inherit;font-size:.9em;font-weight:600;cursor:pointer;transition:all .2s}
        .auth-btn:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}
        .auth-btn.google{background:#fff;color:#1f1f1f}
        .auth-btn.google:hover{background:#f1f1f1}
        .user-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid var(--border);padding:5px 14px 5px 5px;border-radius:999px;font-size:.9em;font-weight:600}
        .user-chip img{width:28px;height:28px;border-radius:50%;object-fit:cover}
        .sync-status{font-size:.78em;color:var(--muted);min-width:96px;text-align:right}

        /* STATS */
        .stats-panel{background:var(--card);backdrop-filter:blur(20px);padding:24px;border-radius:var(--radius-lg);border:1px solid var(--border);margin-bottom:24px}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:16px}
        .stat-box{background:var(--primary);padding:22px;border-radius:var(--radius);text-align:center;transition:transform .3s,box-shadow .3s;cursor:default}
        .stat-box:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(102,126,234,.35)}
        .stat-value{font-size:2.8em;font-weight:800;line-height:1;margin-bottom:6px}
        .stat-label{font-size:.8em;text-transform:uppercase;letter-spacing:1px;opacity:.9}

        /* PROGRESS BAR */
        .progress-wrap{height:12px;background:rgba(255,255,255,.08);border:1px solid var(--border);border-radius:999px;overflow:hidden;margin-bottom:16px}
        .progress-bar{height:100%;width:0;background:var(--primary);border-radius:999px;transition:width .5s cubic-bezier(.4,0,.2,1);box-shadow:0 0 12px rgba(102,126,234,.5)}

        /* COMPLETED EXERCISE CARD */
        .exercise-card.done{border-color:rgba(16,185,129,.55);box-shadow:0 0 0 1px rgba(16,185,129,.35),0 14px 34px rgba(16,185,129,.18)}
        .exercise-card.done .exercise-header::after{content:'✓';position:absolute;top:16px;right:18px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:var(--success);color:#fff;border-radius:50%;font-weight:800;box-shadow:0 4px 12px rgba(16,185,129,.5);z-index:2}

        /* GIF PLACEHOLDER (imagen rota) */
        .exercise-gif.no-img img{display:none}
        .exercise-gif.no-img::after{content:'🏋️';font-size:3.4em;opacity:.35}

        /* CONFETTI */
        .confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:3000;overflow:hidden}
        .confetti{position:absolute;top:-12px;width:9px;height:9px;background:var(--c);border-radius:2px;opacity:.95;animation:confetti-fall linear forwards}
        @keyframes confetti-fall{to{transform:translateY(106vh) translateX(calc(var(--dx)*140px)) rotate(720deg);opacity:.6}}

        /* DAY SELECTOR */
        .day-selector{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
        .day-button{background:var(--card);backdrop-filter:blur(20px);border:2px solid var(--border);padding:26px;border-radius:var(--radius);cursor:pointer;transition:all .3s;text-align:center;position:relative;overflow:hidden;color:var(--text)}
        .day-button::after{content:'';position:absolute;inset:0;background:var(--primary);opacity:0;transition:opacity .3s;z-index:0}
        .day-button:hover::after,.day-button.active::after{opacity:1}
        .day-button:hover{transform:translateY(-6px);box-shadow:0 16px 40px rgba(0,0,0,.3);border-color:transparent}
        .day-button.active{border-color:transparent;box-shadow:0 16px 40px rgba(102,126,234,.3)}
        .day-button>*{position:relative;z-index:1}
        .day-button .emoji{font-size:2.2em;display:block;margin-bottom:12px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
        .day-button h2{font-size:1.5em;font-weight:700;margin-bottom:4px}
        .day-button p{font-size:.9em;opacity:.85;font-weight:500}

        /* LOCATION SELECTOR */
        .location-selector{background:var(--card);backdrop-filter:blur(20px);padding:30px;border-radius:var(--radius-lg);border:1px solid var(--border);margin-bottom:24px;text-align:center;display:none;animation:slideDown .4s ease-out}
        .location-selector.active{display:block}
        @keyframes slideDown{from{opacity:0;transform:translateY(-15px)}to{opacity:1;transform:translateY(0)}}
        .location-selector h3{font-size:1.6em;font-weight:700;margin-bottom:22px;background:var(--primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .location-buttons{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
        .location-btn{padding:22px 55px;border:2px solid var(--border);background:var(--card);backdrop-filter:blur(10px);color:var(--text);border-radius:var(--radius);cursor:pointer;font-size:1.2em;font-weight:700;transition:all .3s;position:relative;overflow:hidden}
        .location-btn:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 12px 30px rgba(0,0,0,.3);border-color:rgba(255,255,255,.3)}
        .location-btn.casa-active{background:var(--casa);border-color:transparent;box-shadow:0 8px 28px rgba(79,172,254,.4)}
        .location-btn.gym-active{background:var(--gym);border-color:transparent;box-shadow:0 8px 28px rgba(240,147,251,.4)}

        /* WORKOUT CONTENT */
        .workout-content{display:none;animation:fadeIn .5s ease-out}
        .workout-content.active{display:block}
        @keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

        /* EXERCISE GRID */
        .exercise-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:22px;margin-bottom:22px}

        /* EXERCISE CARD */
        .exercise-card{background:var(--card);backdrop-filter:blur(20px);border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border);transition:transform .3s,box-shadow .3s}
        .exercise-card:hover{transform:translateY(-7px);box-shadow:0 20px 50px rgba(0,0,0,.35);border-color:rgba(255,255,255,.2)}
        .exercise-header{padding:22px;position:relative}
        .exercise-header.casa-header{background:var(--casa)}
        .exercise-header.gym-header{background:var(--gym)}
        .exercise-num{display:inline-block;background:rgba(255,255,255,.25);padding:5px 12px;border-radius:20px;font-size:.82em;font-weight:600;margin-bottom:10px;backdrop-filter:blur(8px)}
        .exercise-name{font-size:1.35em;font-weight:700;line-height:1.3}
        .exercise-name-en{font-size:.82em;opacity:.88;font-weight:400;display:block;margin-top:4px}
        /* EDITABLE CONFIG (series / reps / peso) */
        .exercise-config{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .cfg-item{background:rgba(255,255,255,.18);border-radius:10px;padding:9px 11px}
        .cfg-item.full{grid-column:1 / -1}
        .cfg-label{font-size:.72em;font-weight:700;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;opacity:.92}
        .stepper{display:flex;align-items:center;justify-content:space-between;gap:8px}
        .stepper button{width:34px;height:34px;border:none;border-radius:8px;background:rgba(255,255,255,.92);color:#1e293b;font-size:1.25em;font-weight:800;cursor:pointer;transition:transform .15s,background .2s;line-height:1;display:flex;align-items:center;justify-content:center}
        .stepper button:hover{background:#fff;transform:scale(1.1)}
        .stepper button:active{transform:scale(.92)}
        .series-count{font-size:1.35em;font-weight:800;min-width:26px;text-align:center}
        .stepper .cfg-input{flex:1;min-width:0}
        .cfg-input{width:100%;padding:9px;border:2px solid rgba(255,255,255,.4);border-radius:8px;font-size:1em;font-weight:700;text-align:center;background:rgba(255,255,255,.95);color:#1e293b;transition:all .2s}
        .cfg-input::placeholder{color:#94a3b8;font-weight:500}
        .cfg-input:focus{outline:none;border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.2);transform:scale(1.02)}

        /* GIF */
        .exercise-gif{width:100%;height:230px;background:linear-gradient(135deg,#1e293b,#334155);display:flex;align-items:center;justify-content:center;overflow:hidden}
        .exercise-gif img{width:100%;height:100%;object-fit:contain;transition:transform .4s}
        .exercise-card:hover .exercise-gif img{transform:scale(1.06)}

        /* BODY */
        .exercise-body{padding:22px}
        .exercise-desc{background:rgba(255,255,255,.05);border-left:3px solid rgba(79,172,254,.6);padding:14px;border-radius:8px;margin-bottom:14px;font-size:.92em;line-height:1.7;color:var(--text)}
        .yt-link{display:inline-flex;align-items:center;gap:8px;background:#ff0000;color:white;padding:10px 18px;border-radius:8px;text-decoration:none;font-size:.9em;font-weight:600;margin-bottom:14px;transition:all .3s;box-shadow:0 4px 12px rgba(255,0,0,.3)}
        .yt-link:hover{background:#cc0000;transform:translateY(-2px);box-shadow:0 6px 18px rgba(255,0,0,.4)}

        /* SETS TRACKER */
        .sets-tracker{padding:16px;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:var(--radius)}
        .sets-title{font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
        .cal-badge{background:linear-gradient(135deg,#f59e0b,#ef4444);color:white;padding:5px 12px;border-radius:20px;font-size:.82em;font-weight:700;box-shadow:0 4px 10px rgba(245,158,11,.3)}
        .set-checkboxes{display:flex;flex-wrap:wrap;gap:10px}
        .set-checkbox{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 14px;background:rgba(255,255,255,.04);border:2px solid rgba(59,130,246,.25);border-radius:10px;cursor:pointer;transition:all .3s;min-width:85px}
        .set-checkbox:hover{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.5);transform:translateY(-2px)}
        .set-checkbox.completed{background:linear-gradient(135deg,#10b981,#059669);border-color:transparent;box-shadow:0 4px 14px rgba(16,185,129,.4)}
        .set-checkbox input{width:20px;height:20px;cursor:pointer;accent-color:var(--success)}
        .set-time{font-size:.72em;opacity:.8;font-weight:600}

        /* BUTTONS */
        .btn-reset{padding:13px 26px;background:linear-gradient(135deg,#ef4444,#dc2626);color:white;border:none;border-radius:10px;cursor:pointer;font-size:.95em;font-weight:700;margin-top:18px;transition:all .3s;box-shadow:0 4px 12px rgba(239,68,68,.3)}
        .btn-reset:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(239,68,68,.4)}
        .btn-history{padding:13px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:white;border:none;border-radius:10px;cursor:pointer;font-size:.95em;font-weight:700;width:100%;margin-top:14px;transition:all .3s;box-shadow:0 4px 12px rgba(59,130,246,.3)}
        .btn-history:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(59,130,246,.4)}

        /* MODAL */
        .modal{display:none;position:fixed;z-index:1000;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);animation:fadeIn .3s}
        .modal-content{background:#1e293b;border:1px solid var(--border);margin:5% auto;padding:38px;border-radius:var(--radius-lg);width:90%;max-width:800px;max-height:80vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:slideUp .4s ease-out}
        @keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
        .modal-close{color:var(--muted);float:right;font-size:30px;cursor:pointer;transition:all .3s;line-height:1}
        .modal-close:hover{color:white;transform:rotate(90deg)}

        /* SCROLLBAR */
        ::-webkit-scrollbar{width:10px}
        ::-webkit-scrollbar-track{background:rgba(255,255,255,.04);border-radius:8px}
        ::-webkit-scrollbar-thumb{background:var(--primary);border-radius:8px}

        /* RESPONSIVE */
        @media(max-width:768px){
            h1{font-size:2em}
            .exercise-grid{grid-template-columns:1fr}
            .day-selector{grid-template-columns:1fr 1fr}
            .stats-grid{grid-template-columns:repeat(2,1fr)}
        }
        @media(max-width:480px){
            body{padding:12px}
            h1{font-size:1.7em}
            .day-selector{grid-template-columns:1fr 1fr}
            .location-buttons{flex-direction:column}
            .location-btn{width:100%;padding:18px}
        }
    </style>
</head>
<body>
<div id="gate" class="gate loading">
    <div class="gate-spinner"></div>
    <div class="gate-card">
        <div class="gate-logo">💪</div>
        <h1 class="gate-title">FitTracker Pro</h1>
        <p class="gate-sub">Tu seguimiento de entrenamientos — Gym &amp; Casa, guardado en la nube.</p>
        <button class="auth-btn google gate-btn" onclick="cloudSignIn()">
            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Iniciar sesión con Google
        </button>
        <p class="gate-note">Necesitás iniciar sesión para acceder a tus rutinas.</p>
    </div>
</div>

<div class="container" id="appRoot" style="display:none">
    <header>
        <div id="authBar" class="auth-bar"></div>
        <h1>💪 FitTracker Pro</h1>
        <p class="subtitle">Gym & Casa · Seguimiento Completo</p>
    </header>

    <div class="stats-panel">
        <div class="stats-grid">
            <div class="stat-box"><div class="stat-value" id="totalSets">0</div><div class="stat-label">Series ✓</div></div>
            <div class="stat-box"><div class="stat-value" id="totalExercises">0</div><div class="stat-label">Ejercicios</div></div>
            <div class="stat-box"><div class="stat-value" id="progress">0%</div><div class="stat-label">Progreso</div></div>
            <div class="stat-box"><div class="stat-value" id="calories">0</div><div class="stat-label">Calorías</div></div>
        </div>
        <div class="progress-wrap" title="Progreso total de la rutina">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <button class="btn-history" onclick="showHistory()">📊 Ver Historial</button>
    </div>

    <div class="day-selector">
        <button class="day-button active" onclick="showDay('day1',this)"><span class="emoji">🔥</span><h2>DÍA 1</h2><p>TORSO</p></button>
        <button class="day-button" onclick="showDay('day2',this)"><span class="emoji">🦵</span><h2>DÍA 2</h2><p>PIERNAS</p></button>
        <button class="day-button" onclick="showDay('day3',this)"><span class="emoji">💪</span><h2>DÍA 3</h2><p>EMPUJES</p></button>
        <button class="day-button" onclick="showDay('day4',this)"><span class="emoji">🎯</span><h2>DÍA 4</h2><p>TIRONES</p></button>
    </div>

    <div class="location-selector active" id="locationSelector">
        <h3>📍 ¿Dónde vas a entrenar hoy?</h3>
        <div class="location-buttons">
            <button class="location-btn casa-active" id="btnCasa" onclick="selectLocation('casa')">🏠 EN CASA</button>
            <button class="location-btn" id="btnGym" onclick="selectLocation('gym')">🏢 EN EL GYM</button>
        </div>
    </div>

    <div id="day1" class="workout-content active">
        <div id="day1-casa"></div>
        <div id="day1-gym" style="display:none"></div>
        <button class="btn-reset" onclick="resetDay('day1')">🔄 Resetear Día 1</button>
    </div>
    <div id="day2" class="workout-content">
        <div id="day2-casa"></div>
        <div id="day2-gym" style="display:none"></div>
        <button class="btn-reset" onclick="resetDay('day2')">🔄 Resetear Día 2</button>
    </div>
    <div id="day3" class="workout-content">
        <div id="day3-casa"></div>
        <div id="day3-gym" style="display:none"></div>
        <button class="btn-reset" onclick="resetDay('day3')">🔄 Resetear Día 3</button>
    </div>
    <div id="day4" class="workout-content">
        <div id="day4-casa"></div>
        <div id="day4-gym" style="display:none"></div>
        <button class="btn-reset" onclick="resetDay('day4')">🔄 Resetear Día 4</button>
    </div>

    <div id="historyModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeHistory()">&times;</span>
            <h2 style="background:var(--primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-size:1.8em;margin-bottom:24px">📊 Historial</h2>
            <div id="historyContent"></div>
        </div>
    </div>
</div>

<script>
let currentDay = 'day1';
let currentLoc = 'casa';

// Escape a value before putting it inside an HTML attribute
function escAttr(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

function buildCard(ex, num, day, loc) {
    const isGym = loc === 'gym';
    const cfg = getConfig(ex, day, loc);
    const series = cfg.series;
    const ytHref = ex.yt.startsWith('http') ? ex.yt : `https://www.youtube.com/results?search_query=${ex.yt}`;
    const configHTML = `
        <div class="exercise-config">
            <div class="cfg-item">
                <span class="cfg-label">🔢 Series</span>
                <div class="stepper">
                    <button type="button" aria-label="Quitar una serie" onclick="changeSeries('${ex.id}','${day}','${loc}',-1)">−</button>
                    <span class="series-count">${series}</span>
                    <button type="button" aria-label="Agregar una serie" onclick="changeSeries('${ex.id}','${day}','${loc}',1)">+</button>
                </div>
            </div>
            <div class="cfg-item">
                <span class="cfg-label">🔁 Reps</span>
                <div class="stepper">
                    <button type="button" aria-label="Bajar repeticiones" onclick="stepField('${ex.id}','${day}','${loc}','reps',-1)">−</button>
                    <input class="cfg-input" id="cfg-reps-${loc}-${ex.id}" type="text" aria-label="Repeticiones" value="${escAttr(cfg.reps)}" onchange="saveField('${ex.id}','${day}','${loc}','reps',this.value)">
                    <button type="button" aria-label="Subir repeticiones" onclick="stepField('${ex.id}','${day}','${loc}','reps',1)">+</button>
                </div>
            </div>
            <div class="cfg-item full">
                <span class="cfg-label">🏋️ Peso / Lingotes</span>
                <div class="stepper">
                    <button type="button" aria-label="Bajar peso" onclick="stepField('${ex.id}','${day}','${loc}','peso',-1)">−</button>
                    <input class="cfg-input" id="cfg-peso-${loc}-${ex.id}" type="text" aria-label="Peso o lingotes" value="${escAttr(cfg.peso)}" placeholder="Ej: 10 kg · 5 lingotes" onchange="saveField('${ex.id}','${day}','${loc}','peso',this.value)">
                    <button type="button" aria-label="Subir peso" onclick="stepField('${ex.id}','${day}','${loc}','peso',1)">+</button>
                </div>
            </div>
        </div>`;
    const sets = Array.from({length: series}, (_, i) => `
        <label class="set-checkbox" id="lbl-${ex.id}-${i+1}">
            <input type="checkbox" data-ex="${ex.id}" data-set="${i+1}" data-day="${day}" data-loc="${loc}" onchange="onCheck(this)">
            <span>Serie ${i+1}</span>
            <span class="set-time" id="time-${ex.id}-${i+1}"></span>
        </label>`).join('');
    return `
    <div class="exercise-card" data-cal="${ex.cal}">
        <div class="exercise-header ${isGym?'gym-header':'casa-header'}">
            <div class="exercise-num">${isGym?'🏢':'🏠'} Ejercicio ${num}</div>
            <div class="exercise-name">${ex.nombre}<span class="exercise-name-en">${ex.nombre_en}</span></div>
            ${configHTML}
        </div>
        <div class="exercise-gif">
            <img src="workout/${escAttr(ex.img)}" alt="${escAttr(ex.nombre)}" loading="lazy" onerror="this.closest('.exercise-gif').classList.add('no-img')">
        </div>
        <div class="exercise-body">
            <div class="exercise-desc">${ex.desc}</div>
            <a href="${ytHref}" target="_blank" class="yt-link">▶️ Ver Tutorial</a>
            <div class="sets-tracker">
                <div class="sets-title">
                    <span>✓ Marcar Series</span>
                    <span class="cal-badge">~${ex.cal} kcal/serie</span>
                </div>
                <div class="set-checkboxes">${sets}</div>
            </div>
        </div>
    </div>`;
}

function renderDay(day, loc) {
    const data = exercisesData[loc][day] || [];
    const container = document.getElementById(`${day}-${loc}`);
    if (!container) return;
    if (!data.length) {
        container.innerHTML = '<p style="text-align:center;padding:40px;color:var(--muted)">Sin ejercicios para este modo</p>';
        return;
    }
    container.innerHTML = `<div class="exercise-grid">${data.map((ex,i) => buildCard(ex, i+1, day, loc)).join('')}</div>`;
    loadState(day, loc);
}

function renderAll() {
    ['day1','day2','day3','day4'].forEach(day => {
        ['casa','gym'].forEach(loc => renderDay(day, loc));
    });
}

function selectLocation(loc) {
    currentLoc = loc;
    document.getElementById('btnCasa').className = 'location-btn' + (loc==='casa'?' casa-active':'');
    document.getElementById('btnGym').className = 'location-btn' + (loc==='gym'?' gym-active':'');
    const casaEl = document.getElementById(`${currentDay}-casa`);
    const gymEl = document.getElementById(`${currentDay}-gym`);
    if (casaEl) casaEl.style.display = loc==='casa' ? 'block' : 'none';
    if (gymEl) gymEl.style.display = loc==='gym' ? 'block' : 'none';
    updateStats();
}

function showDay(day, btn) {
    currentDay = day;
    document.querySelectorAll('.workout-content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.day-button').forEach(b => b.classList.remove('active'));
    document.getElementById(day).classList.add('active');
    btn.classList.add('active');
    selectLocation(currentLoc);
    window.scrollTo({top:0, behavior:'smooth'});
}

function onCheck(cb) {
    const {ex, set, day, loc} = cb.dataset;
    const key = `ft-${day}-${loc}-${ex}-${set}`;
    const lbl = document.getElementById(`lbl-${ex}-${set}`);
    const timeEl = document.getElementById(`time-${ex}-${set}`);
    if (cb.checked) {
        const now = new Date();
        localStorage.setItem(key, now.toISOString());
        lbl.classList.add('completed');
        timeEl.textContent = now.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
    } else {
        localStorage.removeItem(key);
        lbl.classList.remove('completed');
        timeEl.textContent = '';
    }
    updateStats();
    scheduleSync();
    // Celebrate when an exercise (or the whole day) is completed
    if (cb.checked) {
        const card = cb.closest('.exercise-card');
        if (card && card.classList.contains('done')) {
            const dayC = document.getElementById(`${day}-${loc}`);
            const cards = dayC ? dayC.querySelectorAll('.exercise-card') : [];
            const allDone = cards.length && Array.from(cards).every(c => c.classList.contains('done'));
            celebrate(allDone ? 80 : 26);
        }
    }
}

// Lightweight confetti burst (no libraries). Respects reduced-motion.
function celebrate(amount) {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    amount = amount || 26;
    const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe', '#00f2fe', '#10b981', '#f59e0b'];
    const layer = document.createElement('div');
    layer.className = 'confetti-layer';
    for (let i = 0; i < amount; i++) {
        const p = document.createElement('span');
        p.className = 'confetti';
        p.style.setProperty('--c', colors[i % colors.length]);
        p.style.left = (Math.random() * 100) + '%';
        p.style.setProperty('--dx', (Math.random() * 2 - 1).toFixed(2));
        p.style.animationDelay = (Math.random() * 0.25).toFixed(2) + 's';
        p.style.animationDuration = (0.9 + Math.random() * 0.7).toFixed(2) + 's';
        layer.appendChild(p);
    }
    document.body.appendChild(layer);
    setTimeout(() => layer.remove(), 2400);
}

function loadState(day, loc) {
    const container = document.getElementById(`${day}-${loc}`);
    if (!container) return;
    container.querySelectorAll('input[type=checkbox]').forEach(cb => {
        const {ex, set} = cb.dataset;
        const saved = localStorage.getItem(`ft-${day}-${loc}-${ex}-${set}`);
        if (saved) {
            cb.checked = true;
            const lbl = document.getElementById(`lbl-${ex}-${set}`);
            const timeEl = document.getElementById(`time-${ex}-${set}`);
            if (lbl) lbl.classList.add('completed');
            if (timeEl) {
                const d = new Date(saved);
                timeEl.textContent = d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
            }
        }
    });
}

// --- Per-exercise editable config (series / reps / peso) ---
function findEx(day, loc, id) {
    return (exercisesData[loc][day] || []).find(e => e.id === id);
}

function cfgKey(day, loc, id) {
    return `ft-cfg-${day}-${loc}-${id}`;
}

function getConfig(ex, day, loc) {
    const def = {
        series: ex.series,
        reps: ex.reps != null ? String(ex.reps) : '',
        peso: ex.peso != null ? String(ex.peso) : ''
    };
    try {
        const raw = JSON.parse(localStorage.getItem(cfgKey(day, loc, ex.id)));
        if (raw && typeof raw === 'object') {
            return {
                series: Number.isFinite(raw.series) ? raw.series : def.series,
                reps: raw.reps != null ? raw.reps : def.reps,
                peso: raw.peso != null ? raw.peso : def.peso
            };
        }
    } catch (e) {}
    return def;
}

function saveConfig(day, loc, id, patch) {
    const ex = findEx(day, loc, id);
    if (!ex) return;
    const next = { ...getConfig(ex, day, loc), ...patch };
    localStorage.setItem(cfgKey(day, loc, id), JSON.stringify(next));
    scheduleSync();
    return next;
}

function saveField(id, day, loc, field, val) {
    saveConfig(day, loc, id, { [field]: val });
}

// +/- for text fields that start with a number, preserving the unit suffix
function stepField(id, day, loc, field, delta) {
    const ex = findEx(day, loc, id);
    if (!ex) return;
    const input = document.getElementById(`cfg-${field}-${loc}-${id}`);
    const cur = input ? String(input.value) : String(getConfig(ex, day, loc)[field] ?? '');
    const m = cur.match(/^\s*(-?\d+(?:[.,]\d+)?)(.*)$/);
    let num, suffix;
    if (m) {
        num = parseFloat(m[1].replace(',', '.'));
        suffix = m[2];
    } else {
        num = 0;
        suffix = cur.trim() ? ' ' + cur.trim() : '';
    }
    const min = field === 'reps' ? 1 : 0;
    num = Math.max(min, num + delta);
    const numStr = Number.isInteger(num) ? String(num) : String(Math.round(num * 100) / 100);
    const val = (numStr + suffix).trim();
    saveConfig(day, loc, id, { [field]: val });
    if (input) input.value = val;
}

function changeSeries(id, day, loc, delta) {
    const ex = findEx(day, loc, id);
    if (!ex) return;
    const cur = getConfig(ex, day, loc).series;
    const next = Math.max(1, Math.min(12, cur + delta));
    if (next === cur) return;
    // Clean up completion state for removed sets
    if (next < cur) {
        for (let s = next + 1; s <= cur; s++) {
            localStorage.removeItem(`ft-${day}-${loc}-${id}-${s}`);
        }
    }
    saveConfig(day, loc, id, { series: next });
    renderDay(day, loc);
    updateStats();
}

// Stats reflect the WHOLE routine: all 4 days × casa & gym (every card is in the DOM)
function updateStats() {
    const root = document.getElementById('appRoot');
    if (!root) return;
    const allCbs = root.querySelectorAll('.set-checkbox input[type=checkbox]');
    const checkedCount = Array.from(allCbs).filter(c => c.checked).length;
    const total = allCbs.length;
    const pct = total ? Math.round(checkedCount / total * 100) : 0;

    document.getElementById('totalSets').textContent = checkedCount;
    document.getElementById('progress').textContent = pct + '%';
    const bar = document.getElementById('progressBar');
    if (bar) bar.style.width = pct + '%';

    let cal = 0, exDone = 0;
    root.querySelectorAll('.exercise-card').forEach(card => {
        const cardCbs = card.querySelectorAll('input[type=checkbox]');
        const cardChecked = Array.from(cardCbs).filter(c => c.checked).length;
        cal += (parseInt(card.dataset.cal) || 0) * cardChecked;
        const done = cardCbs.length > 0 && cardChecked === cardCbs.length;
        if (done) exDone++;
        card.classList.toggle('done', done);
    });
    document.getElementById('calories').textContent = cal;
    document.getElementById('totalExercises').textContent = exDone;
}

function resetDay(day) {
    if (!confirm('¿Resetear todas las series de este día?')) return;
    ['casa','gym'].forEach(loc => {
        const container = document.getElementById(`${day}-${loc}`);
        if (!container) return;
        container.querySelectorAll('input[type=checkbox]').forEach(cb => {
            const {ex, set} = cb.dataset;
            localStorage.removeItem(`ft-${day}-${loc}-${ex}-${set}`);
            cb.checked = false;
            const lbl = document.getElementById(`lbl-${ex}-${set}`);
            const timeEl = document.getElementById(`time-${ex}-${set}`);
            if (lbl) lbl.classList.remove('completed');
            if (timeEl) timeEl.textContent = '';
        });
    });
    updateStats();
    scheduleSync();
}

function showHistory() {
    const days = ['day1','day2','day3','day4'];
    const dayNames = {day1:'Torso',day2:'Piernas',day3:'Empujes',day4:'Tirones'};
    let html = '';
    let anyData = false;
    days.forEach(day => {
        ['casa','gym'].forEach(loc => {
            const data = exercisesData[loc][day] || [];
            const entries = [];
            data.forEach(ex => {
                const series = getConfig(ex, day, loc).series;
                for (let s=1; s<=series; s++) {
                    const v = localStorage.getItem(`ft-${day}-${loc}-${ex.id}-${s}`);
                    if (v) entries.push({name: ex.nombre, set: s, time: new Date(v)});
                }
            });
            if (entries.length) {
                anyData = true;
                html += `<div style="margin-bottom:20px;padding:16px;background:rgba(255,255,255,.05);border-radius:12px;border:1px solid var(--border)">
                    <h3 style="margin-bottom:12px;color:var(--text)">📅 Día ${day.replace('day','')} - ${dayNames[day]} · ${loc==='gym'?'🏢 Gym':'🏠 Casa'}</h3>
                    ${entries.map(e => `<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:.9em;color:var(--muted)">✓ <b style="color:var(--text)">${e.name}</b> — Serie ${e.set} · ${e.time.toLocaleString('es-AR')}</div>`).join('')}
                </div>`;
            }
        });
    });
    if (!anyData) html = '<p style="text-align:center;color:var(--muted);padding:30px">Todavía no hay historial. ¡Empezá a entrenar!</p>';
    document.getElementById('historyContent').innerHTML = html;
    document.getElementById('historyModal').style.display = 'block';
}

function closeHistory() {
    document.getElementById('historyModal').style.display = 'none';
}

window.onclick = e => { if (e.target === document.getElementById('historyModal')) closeHistory(); };

// ==================== CLOUD SYNC (Firebase) ====================
let cloudUid = null;
let syncTimer = null;

// Gather all FitTracker localStorage into two maps for Firestore
function collectState() {
    const cfg = {}, sets = {};
    for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith('ft-cfg-')) {
            try { cfg[k] = JSON.parse(localStorage.getItem(k)); } catch (e) {}
        } else if (k.startsWith('ft-day')) {
            sets[k] = localStorage.getItem(k);
        }
    }
    return { cfg, sets };
}

function clearLocalFt() {
    const del = [];
    for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith('ft-')) del.push(k);
    }
    del.forEach(k => localStorage.removeItem(k));
}

function setSync(text) {
    const s = document.getElementById('syncStatus');
    if (s) s.textContent = text;
}

// Debounced push of full state to the cloud (no-op when logged out)
function scheduleSync() {
    if (!cloudUid) return;
    setSync('Guardando…');
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => {
        window.cloudSaveDoc(cloudUid, collectState())
            .then(() => setSync('✓ Guardado'))
            .catch(err => { console.error(err); setSync('⚠ Error al guardar'); });
    }, 800);
}

// Show the landing/gate in a given mode: 'loading' | 'landing'
function showGate(mode) {
    const g = document.getElementById('gate');
    if (g) {
        g.classList.remove('hidden');
        g.classList.toggle('loading', mode === 'loading');
        g.classList.toggle('landing', mode === 'landing');
    }
    const app = document.getElementById('appRoot');
    if (app) app.style.display = 'none';
}

function showApp() {
    const g = document.getElementById('gate');
    if (g) g.classList.add('hidden');
    const app = document.getElementById('appRoot');
    if (app) app.style.display = 'block';
}

// Called by the Firebase module on auth state change
window.onAuthChanged = async (user) => {
    cloudUid = user ? user.uid : null;
    if (user) {
        updateAuthUI(user);
        showApp();
        await pullState();
    } else {
        // Logged out: wipe local cache so no data leaks to the next user on this device
        clearLocalFt();
        renderAll();
        selectLocation(currentLoc);
        updateStats();
        showGate('landing');
    }
};

async function pullState() {
    setSync('Sincronizando…');
    let data = null;
    try {
        data = await window.cloudLoadDoc(cloudUid);
    } catch (err) {
        console.error(err);
        setSync('⚠ Error al sincronizar');
        return;
    }
    const local = collectState();
    const cloudEmpty = !data ||
        ((!data.cfg || !Object.keys(data.cfg).length) && (!data.sets || !Object.keys(data.sets).length));
    const localHas = Object.keys(local.cfg).length || Object.keys(local.sets).length;

    if (cloudEmpty && localHas) {
        // First login on a device that already had local data → seed the cloud
        try { await window.cloudSaveDoc(cloudUid, local); } catch (err) { console.error(err); }
    } else if (data) {
        // Cloud is the source of truth → replace local
        clearLocalFt();
        Object.entries(data.cfg || {}).forEach(([k, v]) =>
            localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v)));
        Object.entries(data.sets || {}).forEach(([k, v]) =>
            localStorage.setItem(k, v));
    }
    renderAll();
    selectLocation(currentLoc);
    updateStats();
    setSync('✓ Sincronizado');
}

function updateAuthUI(user) {
    const el = document.getElementById('authBar');
    if (!el) return;
    if (user) {
        const name = user.displayName || user.email || 'Usuario';
        const photo = user.photoURL
            ? `<img src="${user.photoURL}" alt="" referrerpolicy="no-referrer">` : '';
        el.innerHTML =
            `<span id="syncStatus" class="sync-status"></span>
             <div class="user-chip">${photo}<span>${name}</span></div>
             <button class="auth-btn" onclick="cloudSignOut()">Salir</button>`;
    } else {
        el.innerHTML =
            `<button class="auth-btn google" onclick="cloudSignIn()">
                <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                Iniciar sesión con Google
            </button>`;
    }
}

// INIT — build the app (hidden) and show the loading gate until Firebase
// resolves the session. onAuthChanged then reveals the app or the landing.
renderAll();
selectLocation('casa');
updateStats();
showGate('loading');
</script>

<!-- Firebase Auth + Firestore (SDK modular v10) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { initializeAppCheck, ReCaptchaV3Provider }
    from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app-check.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence }
    from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc }
    from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const cfg = window.FIREBASE_CONFIG || {};
const configured = cfg.apiKey && !cfg.apiKey.startsWith('TU_');

if (!configured) {
    console.warn('[FitTracker] Firebase todavía no está configurado. Editá firebase-config.js.');
    window.cloudSignIn = () => alert('Firebase todavía no está configurado.\nPegá tu firebaseConfig en firebase-config.js y recargá.');
    window.cloudSignOut = () => {};
    if (window.onAuthChanged) window.onAuthChanged(null);
} else {
    const app = initializeApp(cfg);

    // App Check (opcional): protege el backend contra uso de la apiKey desde afuera.
    const siteKey = window.APPCHECK_SITE_KEY;
    if (siteKey && siteKey.trim()) {
        try {
            initializeAppCheck(app, {
                provider: new ReCaptchaV3Provider(siteKey.trim()),
                isTokenAutoRefreshEnabled: true
            });
        } catch (e) { console.error('[FitTracker] App Check no se pudo iniciar:', e); }
    }

    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();
    setPersistence(auth, browserLocalPersistence).catch(e => console.error(e));

    window.cloudSignIn = () => signInWithPopup(auth, provider)
        .catch(e => { console.error(e); alert('No se pudo iniciar sesión: ' + e.message); });
    window.cloudSignOut = () => signOut(auth);
    window.cloudLoadDoc = async (uid) => {
        const snap = await getDoc(doc(db, 'users', uid));
        return snap.exists() ? snap.data() : null;
    };
    window.cloudSaveDoc = (uid, data) => setDoc(doc(db, 'users', uid), data);

    onAuthStateChanged(auth, (user) => {
        if (window.onAuthChanged) window.onAuthChanged(user);
    });
}
</script>
